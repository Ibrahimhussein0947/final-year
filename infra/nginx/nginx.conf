# Single public entry point: static React app + reverse proxy to the API (HTTP and WebSocket).
# TLS is terminated in front of this container (host Nginx/Caddy, a load balancer or Cloudflare); see docs/07-deployment.md.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api_upstream {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads are capped at 5 MB by the API; leave room for the multipart envelope.
  client_max_body_size 6m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location = /nginx-health { access_log off; return 200 "ok\n"; }
  # For uptime monitors: asks the API (and through it the database) whether it is healthy.
  location = /api-health { access_log off; proxy_pass http://api_upstream/health; proxy_set_header Host $host; }

  # Login, registration, refresh: stricter limit on top of the API's own limiter.
  location /api/v1/auth/ {
    limit_req zone=auth_zone burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /api/ {
    limit_req zone=api_zone burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached for a long time; the HTML shell must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # PWA: the service worker and manifest must always be revalidated or an old worker could stay for a year.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
