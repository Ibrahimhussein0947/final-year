# Continuous integration. Runs on every push and pull request.
# This workflow has NOT been executed on GitHub yet (it was written locally); the commands in it were each run locally,
# but the first real run may need small fixes. The `ai` job is non-blocking until it has passed once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, tests, build, evaluation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ethiotalent
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ethiotalent_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ethiotalent -d ethiotalent_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ethiotalent:ci_only_password@localhost:5433/ethiotalent_test?schema=public
      JWT_ACCESS_SECRET: ci_only_secret_that_is_at_least_32_characters_long
      BCRYPT_ROUNDS: "4"
      EXPOSE_DEV_OTP: "true"
      UPLOAD_DIR: ./uploads-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Database extensions, migrations and seed
        working-directory: apps/api
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -p 5433 -U ethiotalent -d ethiotalent_test -f ../../infra/db-init/01-extensions.sql
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed/index.ts
      - name: Typecheck
        working-directory: apps/api
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/api
        run: npx tsc -p tsconfig.build.json
      - name: Tests (unit, integration, security, end-to-end, performance)
        working-directory: apps/api
        run: npx vitest run
      - name: Ranking evaluation (must run; results are in the log)
        working-directory: apps/api
        run: npm run eval

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npx vitest run
        working-directory: apps/web
      - run: npx vite build
        working-directory: apps/web
      - run: node scripts/verify-pwa.mjs
        working-directory: apps/web

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/api.Dockerfile, target: runtime, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Migration image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/api.Dockerfile, target: tools, push: false, cache-from: type=gha }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/web.Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    # Known findings (zod, react-router) need major upgrades; see docs/06-testing-and-evaluation.md.
    # Non-blocking so they stay visible without hiding other failures. Remove continue-on-error after upgrading.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high

  ai:
    name: AI service tests (fake embedding backend)
    runs-on: ubuntu-latest
    # Never run yet: non-blocking until it has passed once.
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/ai/requirements.txt }
      # Only the light dependencies: the tests use a fake backend, so PyTorch and the model are not needed.
      - run: pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" numpy httpx "pytest>=8.0"
      - run: python -m pytest
